ький мир • прогулка V1</div></div><div id="help">Веди золотую лапку в любую сторону • отпусти, чтобы остановиться</div><div id="joy"><div id="thumb">🐾</div></div><div id="state">🐶 Пряник<br>Свитер V5 • живая ходьба</div><div id="error"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script><script type="module">

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff7e9,0x668c78,2));const sun=new THREE.DirectionalLight(0xffefcc,3);sun.position.set(-5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-13;sun.shadow.camera.right=13;sun.shadow.camera.top=13;sun.shadow.camera.bottom=-13;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=mat('#74a86a'),path=mat('#ebd4a4'),fur=mat('#b66a36'),furLight=mat('#d78c4c'),furDark=mat('#8b4d2b'),cream=mat('#eee1c4'),nose=mat('#2a201b'),eye=mat('#17100f',.3),pink=mat('#d38e84'),hedge=mat('#3e854a');

const ground=mesh(scene,new THREE.PlaneGeometry(200,200),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
mesh(scene,new THREE.BoxGeometry(12,.035,12),path,0,.018,0).receiveShadow=true;
const stones=mat('#e5c58e');for(let i=0;i<85;i++){let x=Math.sin(i*19.7)*5.5,z=Math.cos(i*11.3)*5.5;ball(scene,stones,x,.035,z,.04,.015,.025)}
const shrub=(x,z,r=1)=>{ball(scene,hedge,x,.48*r,z,.55*r,.5*r,.5*r);ball(scene,mat('#58a35a'),x-.27*r,.67*r,z+.13*r,.3*r,.32*r,.28*r)};

const loading=new GLTFLoader();
let mixer=null,walkAction=null,wasWalking=false;
loading.load('../pryanik-walk-test-v1/Pryanik_walk_compare.glb?v=lettered-v2',gltf=>{

 if(!o.isMesh||!o.name.startsWith('PRYANIK_logo_'))return;

 o.material.polygonOffsetUnits=-4;
});

 if(!walkClip)throw new Error('В модели нет анимации ходьбы');

 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());
 model.scale.setScalar(1.65/Math.max(size.x,size.y,size.z));model.updateMatrixWorld(true);
 const fitted=new THREE.Box3().setFromObject(model),center=fitted.getCenter(new THREE.Vector3());
 model.position.set(-center.x,-fitted.min.y,-center.z);
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 modelFrame.add(model);modelLoaded=true;
 status.innerHTML='🐶 Пряник готов<br>Ходи золотой лапкой';
},undefined,e=>{
 status.innerHTML='Не удалось загрузить Пряника';
 const el=document.getElementById('error');el.style.display='block';el.textContent='Ошибка загрузки модели. Обнови страницу. '+(e.message||'');
 console.warn('Model load failed',e);
});
const shadow=mesh(scene,new THREE.CircleGeometry(.75,24),new THREE.MeshBasicMaterial({color:0x4b6248,transparent:true,opacity:.2,depthWrite:false}),0,.047,0);shadow.rotation.x=-Math.PI/2;
let vx=0,vz=0,angle=0,phase=0;const joy=document.getElementById('joy'),thumb=document.getElementById('thumb');let active=null;const input={x:0,y:0};
function move(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),range=43,clamp=Math.min(1,dist/range);input.x=dist>7?dx/dist*clamp:0;input.y=dist>7?dy/dist*clamp:0;thumb.style.transform='translate('+input.x*range+'px,'+input.y*range+'px)'}
function resetJoy(){active=null;input.x=0;input.y=0;thumb.style.transform='translate(0,0)'}
/* iOS Safari: handle touch natively and suppress its text loupe, long-press and zoom. */

joy.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();if(touchId!==null)return;const t=e.changedTouches[0];touchId=t.identifier;move(t)},{passive:false});

function endTouch(e){e.preventDefault();e.stopPropagation();for(const t of e.changedTouches){if(t.identifier===touchId){touchId=null;resetJoy();break}}}
joy.addEventListener('touchend',endTouch,{passive:false});joy.addEventListener('touchcancel',endTouch,{passive:false});
joy.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();active=e.pointerId;joy.setPointerCapture(active);move(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;if(e.pointerId===active){e.preventDefault();move(e)}});
function release(e){if(e.pointerType==='touch')return;e.preventDefault();if(e.pointerId!==active)return;resetJoy()}
joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
document.addEventListener('touchstart',e=>e.preventDefault(),{passive:false,capture:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false,capture:true});
document.addEventListener('touchend',e=>e.preventDefault(),{passive:false,capture:true});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});

const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{touchId=null;resetJoy();keys.clear();vx=0;vz=0;});

let ix=modelLoaded?input.x:0,iz=modelLoaded?input.y:0;if(modelLoaded&&keys.size){ix=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));iz=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'))}
