<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Пряник — точная коррекция глаза</title><style>*{box-sizing:border-box}body{margin:0;background:#243938;color:#fff;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;z-index:4;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:8px 10px;pointer-events:none;text-shadow:0 2px 6px #000}h1{font-size:17px;color:#ffe3ac;margin:0 0 4px}#status{font-size:12px;line-height:1.35}#panel{position:fixed;z-index:5;bottom:calc(10px + env(safe-area-inset-bottom));left:9px;right:9px;background:#1e3632ee;border:1px solid #a88d62;border-radius:15px;padding:10px;display:grid;gap:8px}#actions{display:flex;gap:7px}button{border:1px solid #e2bd7f;border-radius:10px;padding:10px;color:white;background:#38564b;font-weight:700;font-size:13px;flex:1}button.primary{background:#bb9255;color:#192d28}label{display:flex;align-items:center;gap:8px;font-size:12px}label span{min-width:62px}input[type=range]{min-width:0;flex:1;accent-color:#f2c57d}#hint{font-size:11px;color:#f0dec3;line-height:1.3}#coords{font-size:11px;color:#f6d99d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>🐶 Пряник · операция без повреждений</h1><div id="status">Загружаю целую модель со скелетом…</div></header><div id="panel"><div id="actions"><button id="mark" class="primary">🎯 Указать соломинку</button><button id="toggle">👁 Выкл. заплатку</button><button id="reset">↺ Камера</button></div><label><span>Размер</span><input id="size" type="range" min="5" max="50" value="20" step="1"><output id="sizev">20</output></label><label><span>Глубина</span><input id="depth" type="range" min="-30" max="30" value="4" step="1"><output id="depthv">4</output></label><div id="hint">Поверни Пряника лицом к себе. Нажми «Указать соломинку» и коснись светлого кусочка в левом для нас глазу. Это пробная накладка — исходная модель не меняется.</div><div id="coords">Положение ещё не выбрано</div><button id="copy">📋 Скопировать параметры для хирурга</button></div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x243938);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a6851,2.1));const sun=new THREE.DirectionalLight(0xffe9cd,2.7);sun.position.set(-3,7,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x52745b}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.02,40);let yaw=.1,pitch=.08,r=2.1;function setCam(){cam.position.set(r*Math.sin(yaw)*Math.cos(pitch),.54+r*Math.sin(pitch),r*Math.cos(yaw)*Math.cos(pitch));cam.lookAt(0,.54,0)}setCam();
let dog,head,patch,patchPoint=null,mixer,markMode=false,patchVisible=true,drag=null;
function patchUpdate(){if(!patch||!patchPoint)return;const sz=Number($('size').value)/1000;patch.scale.set(sz*1.25,sz,sz*.65);const d=Number($('depth').value)/1000;const pos=patchPoint.point.clone().addScaledVector(patchPoint.normal,d);patch.position.copy(pos);patch.quaternion.copy(patchPoint.quat);$('coords').textContent='Голова XYZ: '+patchPoint.point.toArray().map(n=>n.toFixed(4)).join(', ')+' | размер '+$('size').value+' | глубина '+$('depth').value;}
new GLTFLoader().load('https://raw.githubusercontent.com/sfruting777-arch/busya-pryanik-/main/Pryanik_2_rig_walk_UPLOAD.glb',g=>{try{dog=g.scene;dog.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(dog),size=b.getSize(new THREE.Vector3());dog.scale.setScalar(1.04/size.y);dog.updateMatrixWorld(true);b.setFromObject(dog);const cent=b.getCenter(new THREE.Vector3());dog.position.set(-cent.x,-b.min.y+.015,-cent.z);dog.traverse(x=>{if(x.isSkinnedMesh)x.frustumCulled=false;if(x.isBone&&x.name==='head_neck')head=x});scene.add(dog);mixer=new THREE.AnimationMixer(dog);if(g.animations.length)mixer.clipAction(g.animations[0]).play();$('status').textContent='✅ Исходный Пряник загружен · нажми 🎯 и укажи дефект';}catch(e){$('status').textContent='Ошибка: '+e.message}},e=>{if(e.total)$('status').textContent='Загрузка '+Math.round(100*e.loaded/e.total)+'%'},e=>$('status').textContent='Ошибка загрузки GLB: '+(e.message||'сеть'));
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(!markMode){yaw-=dx*.008;pitch=THREE.MathUtils.clamp(pitch+dy*.006,-.25,1.2);setCam()}drag.x=e.clientX;drag.y=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(!markMode||moved||!dog)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=1-e.clientY/innerHeight*2;ray.setFromCamera(mouse,cam);const meshes=[];dog.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)meshes.push(o)});const hits=ray.intersectObjects(meshes,false);if(!hits.length){$('status').textContent='Не попал по мордочке · попробуй ещё';return}
const hit=hits[0],bone=head||dog;bone.updateWorldMatrix(true,false);
const point=bone.worldToLocal(hit.point.clone());const n=cam.position.clone().sub(hit.point).normalize();const base=hit.point.clone(),toward=bone.worldToLocal(base.clone().add(n)).sub(point).normalize();
if(patch)patch.parent.remove(patch);
patch=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshStandardMaterial({color:0x1c0e0a,roughness:.22,metalness:0}));patch.name='temporary_eye_patch';bone.add(patch);
const localQuat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),toward);patchPoint={point,normal:toward,quat:localQuat};patchUpdate();markMode=false;$('mark').textContent='🎯 Указать заново';patch.visible=patchVisible;$('status').textContent='✅ Заплатка поставлена · меняй размер и глубину';});
$('mark').onclick=()=>{markMode=true;$('status').textContent='🎯 Теперь коснись дефекта на 3D-модели';$('mark').textContent='👆 Коснись глаза'};
$('toggle').onclick=()=>{patchVisible=!patchVisible;if(patch)patch.visible=patchVisible;$('toggle').textContent=patchVisible?'👁 Выкл. заплатку':'👁 Вкл. заплатку'};
$('reset').onclick=()=>{yaw=.1;pitch=.08;r=2.1;setCam()};
for(const id of ['size','depth'])$(id).addEventListener('input',()=>{$(id+'v').textContent=$(id).value;patchUpdate()});
$('copy').onclick=()=>{if(!patchPoint){$('status').textContent='Сначала выбери точку на глазу';return}const str='Положение заплатки Пряника: '+$('coords').textContent;try{navigator.clipboard.writeText(str).then(()=>$('status').textContent='✅ Параметры скопированы').catch(()=>$('status').textContent=str)}catch(e){$('status').textContent=str}};
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);renderer.render(scene,cam)}loop();
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
