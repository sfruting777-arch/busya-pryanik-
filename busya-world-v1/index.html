<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Буся — прогулка v1</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8d8d0;font-family:system-ui,-apple-system,sans-serif;color:white;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;text-align:center;text-shadow:0 2px 6px #26342bbf}h1{margin:4px;font-size:clamp(19px,5vw,25px);color:#ffe7a4}#status{font-size:12px}#panel{position:fixed;right:10px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:end;gap:8px}button,.file{background:#554335d9;border:2px solid #f4d594;color:white;padding:10px 14px;border-radius:16px;font-weight:650;font-size:14px;box-shadow:0 2px 9px #0003}.file{display:block}input[type=file]{display:none}#speed{width:105px;accent-color:#e7ba54}#joy{position:fixed;left:24px;bottom:calc(22px + env(safe-area-inset-bottom));width:138px;height:138px;border-radius:50%;border:3px solid #fbe5a5;background:#3b5b49a8;box-shadow:0 0 15px #fff5;display:grid;place-items:center;touch-action:none}#thumb{width:67px;height:67px;border-radius:50%;border:2px solid #fff0c0;background:#a5763ecc;display:grid;place-items:center;font-size:37px;transform:translate(0px,0px);touch-action:none}#notice{position:fixed;top:80px;left:12px;right:12px;text-align:center;color:#fff;background:#2c3428db;border-radius:12px;padding:9px;display:none;max-width:460px;margin:auto;font-size:13px}#details{position:fixed;left:10px;bottom:calc(177px + env(safe-area-inset-bottom));font-size:11px;text-shadow:0 1px 4px #000;opacity:.95}</style></head><body>
<div id="top"><h1>🐶 Буся гуляет по саду</h1><div id="status">Подготовка мира…</div></div><div id="notice"></div><div id="details">Джойстик — движение · поворот камеры пальцем</div><div id="joy"><div id="thumb">🐾</div></div><div id="panel"><button id="pause">⏸ Пауза</button><button id="reset">↺ В начало</button><label class="file" for="load">📁 Выбрать GLB</label><input id="load" type="file" accept=".glb,model/gltf-binary"><label style="font-size:12px;text-shadow:0 2px 5px #000">Скорость <input type="range" id="speed" min=".5" max="1.7" step=".1" value="1"></label></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s);const status=$('#status');const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa6d5da);scene.fog=new THREE.Fog(0xa6d5da,28,90);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,130);scene.add(new THREE.HemisphereLight(0xf4ffff,0x5e7139,2.4));const sun=new THREE.DirectionalLight(0xfff2c8,2.2);sun.position.set(-9,17,5);scene.add(sun);const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const grass=mat(0x78a764),path=mat(0xd5b98b),trunk=mat(0x76513b),leaf=mat(0x4e8a46),leaf2=mat(0x6b9d50),flowerA=mat(0xf3a9ba),flowerB=mat(0xffec9d),rockMat=mat(0x9dada0);const plane=new THREE.Mesh(new THREE.PlaneGeometry(110,110),grass);plane.rotation.x=-Math.PI/2;scene.add(plane);const road=new THREE.Mesh(new THREE.PlaneGeometry(7,72),path);road.rotation.x=-Math.PI/2;road.position.y=.007;scene.add(road);const cross=new THREE.Mesh(new THREE.PlaneGeometry(35,5),path);cross.rotation.x=-Math.PI/2;cross.position.set(0,.009,-9);scene.add(cross);
function rng(n){let x=Math.sin(n*129.5+51)*43758.5453;return x-Math.floor(x)}function tree(x,z,k){let t=new THREE.Group();let stem=new THREE.Mesh(new THREE.CylinderGeometry(.17*k,.27*k,2.1*k,7),trunk);stem.position.y=1.05*k;t.add(stem);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.12*k,1),k%2>1?leaf:leaf2);crown.position.y=2.6*k;t.add(crown);t.position.set(x,0,z);scene.add(t)}for(let i=0;i<75;i++){const x=(rng(i+4)-.5)*84,z=(rng(i+114)-.5)*84;if(Math.abs(x)<5||Math.abs(z+9)<4&&Math.abs(x)<19)continue;tree(x,z,.65+rng(i+72)*.8)}for(let i=0;i<160;i++){let x=(rng(i+523)-.5)*74,z=(rng(i+701)-.5)*74;if(Math.abs(x)<4)continue;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.015,.017,.2,4),leaf);stem.position.set(x,.1,z);scene.add(stem);const bud=new THREE.Mesh(new THREE.IcosahedronGeometry(.10,0),i%3?flowerA:flowerB);bud.position.set(x,.25,z);scene.add(bud)}for(let i=0;i<32;i++){let x=(rng(i+943)-.5)*72,z=(rng(i+1134)-.5)*72;if(Math.abs(x)<4)continue;const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(.28+rng(i+988)*.22,0),rockMat);rock.position.set(x,.16,z);rock.scale.y=.55;scene.add(rock)}
const dog=new THREE.Group();scene.add(dog);dog.position.set(0,0,6);const shadow=new THREE.Mesh(new THREE.CircleGeometry(.55,24),new THREE.MeshBasicMaterial({color:0x2a392c,transparent:true,opacity:.24,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.014,6);scene.add(shadow);let body,mixer,walk,idle,loaded=false,modelHeight=1,orient=0;
function notify(t){const n=$('#notice');n.textContent=t;n.style.display=t?'block':'none'}
function parse(buffer){new GLTFLoader().parse(buffer,'',g=>{if(body)dog.remove(body);mixer?.stopAllAction();body=g.scene;dog.add(body);body.updateMatrixWorld(true);let bb=new THREE.Box3().setFromObject(body);const sz=bb.getSize(new THREE.Vector3());if(!isFinite(sz.y)||sz.y<.01){notify('Ошибка масштаба GLB');return}const scale=1.1/sz.y;body.scale.setScalar(scale);body.updateMatrixWorld(true);bb.setFromObject(body);const c=bb.getCenter(new THREE.Vector3());body.position.x-=c.x;body.position.y-=bb.min.y;body.position.z-=c.z;modelHeight=bb.getSize(new THREE.Vector3()).y; // Model axes: Meshy Busya faces -X; rotate to local +Z
body.rotation.y=-Math.PI/2;body.updateMatrixWorld(true);
mixer=new THREE.AnimationMixer(body);walk=g.animations.find(x=>/walk/i.test(x.name))||g.animations[0];idle=g.animations.find(x=>/idle/i.test(x.name))||g.animations[1]||g.animations[0];walk=walk?mixer.clipAction(walk):null;idle=idle?mixer.clipAction(idle):null;if(idle)idle.play();loaded=true;notify('');status.textContent='Буся готов! Двигай золотую лапку 🐾';},e=>notify('GLB не прочитан: '+e.message))}
function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('busya-model-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function keep(buf){try{const d=await db(),tx=d.transaction('files','readwrite');tx.objectStore('files').put(buf,'busya-v1')}catch(e){console.warn('Cache unavailable',e)}}async function cached(){try{const d=await db();return await new Promise((resolve,reject)=>{const t=d.transaction('files','readonly').objectStore('files').get('busya-v1');t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)})}catch(e){return null}}
$('#load').onchange=async e=>{let f=e.target.files[0];if(!f)return;const buf=await f.arrayBuffer();parse(buf);keep(buf)};
async function begin(){let b=await cached();if(b){parse(b);return}try{const r=await fetch('./Busya_walk_idle_test_v1.glb?v=2');if(!r.ok)throw Error('not yet uploaded');b=await r.arrayBuffer();parse(b);keep(b)}catch(e){status.textContent='Выбери GLB Буси один раз';notify('Нажми «Выбрать GLB», укажи Busya_walk_idle_test_v1.glb из «Файлов» iPhone. После этого модель запомнится в браузере.')}}begin();
let joyX=0,joyY=0,lastPointer=null;const joystick=$('#joy'),thumb=$('#thumb');function setJoy(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,k=Math.min(1,54/Math.max(1,Math.hypot(dx,dy)));joyX=dx*k/54;joyY=dy*k/54;thumb.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);setJoy(e)});joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))setJoy(e)});function stop(){joyX=joyY=0;thumb.style.transform='translate(0px,0px)'}joystick.addEventListener('pointerup',stop);joystick.addEventListener('pointercancel',stop);
let angle=0.25,pitch=.3,camDist=6.8,drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;angle-=(e.clientX-drag.x)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*.005,.12,.9);drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
let paused=false,moving=false;$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'▶ Продолжить':'⏸ Пауза'};$('#reset').onclick=()=>{dog.position.set(0,0,6);angle=.25;pitch=.3};const clock=new THREE.Clock(),vec=new THREE.Vector3();camera.position.set(4,4,11);
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.045);if(!paused&&loaded){const amt=Math.min(1,Math.hypot(joyX,joyY)),speed=Number($('#speed').value)*2;const shouldMove=amt>.08;if(shouldMove){const f=-joyY,s=joyX;const a=angle;vec.set(s*Math.cos(a)+f*Math.sin(a),0,-f*Math.cos(a)+s*Math.sin(a));vec.normalize();dog.position.addScaledVector(vec,dt*speed*amt);dog.position.x=THREE.MathUtils.clamp(dog.position.x,-43,43);dog.position.z=THREE.MathUtils.clamp(dog.position.z,-43,43);let target=Math.atan2(vec.x,vec.z);let diff=Math.atan2(Math.sin(target-dog.rotation.y),Math.cos(target-dog.rotation.y));dog.rotation.y+=diff*(1-Math.exp(-dt*9));}if(shouldMove!==moving){if(shouldMove&&walk){walk.reset().fadeIn(.22).play();if(idle&&idle!==walk)idle.fadeOut(.22)}else if(idle){idle.reset().fadeIn(.22).play();if(walk&&walk!==idle)walk.fadeOut(.22)}moving=shouldMove}if(mixer){mixer.timeScale=shouldMove?Math.max(.6,amt*Number($('#speed').value)):1;mixer.update(dt)}}shadow.position.set(dog.position.x,.018,dog.position.z);const p=dog.position;const y=2.9+Math.sin(pitch)*2.1;const off=new THREE.Vector3(Math.sin(angle)*camDist,y,Math.cos(angle)*camDist);const desired=p.clone().add(off);camera.position.lerp(desired,1-Math.exp(-dt*4));camera.lookAt(p.x,modelHeight*.66,p.z);renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
