<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Сказочный сад — прототип уровня</title><style>*{box-sizing:border-box}body{margin:0;background:#11162c;color:#fff;font-family:system-ui;text-align:center}h2{margin:12px 0 3px;color:#ffd36d}p{margin:4px 0 10px;color:#f7e2b0}canvas{display:block;width:min(96vw,620px);aspect-ratio:1;border:4px solid #f4bd5b;border-radius:18px;margin:auto;touch-action:none;background:#86bc69}#controls{display:flex;align-items:center;justify-content:space-around;max-width:500px;margin:18px auto}#joy{width:156px;height:156px;border:3px solid #e4b75d;border-radius:50%;background:#30304b;position:relative;touch-action:none;box-shadow:0 0 20px #d4a55055}#knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:66px;line-height:1;pointer-events:none;filter:drop-shadow(0 0 7px #ffc965)}button{font:700 18px system-ui;border:0;border-radius:18px;background:#ffe3a0;padding:14px}small{color:#c6c9d8}</style><h2>🌳 Сказочный сад</h2><p id="hud">Собери Monge: 0 / 12</p><canvas id="scene" width="600" height="600"></canvas><div id="controls"><div id="joy"><span id="knob">🐾</span></div><button id="restart">Заново ↻</button></div><small>Экспериментальный уровень · основная игра не изменена</small><script>
const c=document.getElementById('scene'),g=c.getContext('2d'),hud=document.getElementById('hud'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
const S=64,N=30,W=N*S,obstacles=new Set(),food=new Set(),flowers=[],trees=[];
let p={x:3.5*S,y:3.5*S},keys={},axis={x:0,y:0},collected=0,cam={x:0,y:0},last=0;
function k(x,y){return x+','+y}function blocked(x,y){return x<1||y<1||x>=N-1||y>=N-1||obstacles.has(k(x,y))}
function addRect(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)obstacles.add(k(i,j))}
function build(){obstacles.clear();food.clear();flowers.length=0;trees.length=0;collected=0;p={x:3.5*S,y:3.5*S};cam={x:p.x,y:p.y};
 // Open zones connected by broad winding corridors; obstacles are scenery, not a square maze.
 for(const [x,y,w,h] of [[6,2,3,6],[12,3,4,3],[19,2,5,5],[3,12,5,4],[11,10,3,5],[18,11,6,3],[7,20,4,6],[15,20,3,5],[22,19,4,6]])addRect(x,y,w,h);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const seed=(x*37+y*91+x*y*13)%101;if(blocked(x,y)&&seed%4===0)trees.push({x:(x+.5)*S,y:(y+.5)*S});else if(!blocked(x,y)&&seed%7===0)flowers.push({x:(x+.5)*S,y:(y+.5)*S,color:['#fff1aa','#ff81ac','#b3a3ff'][seed%3]})}
 for(const [x,y] of [[4,4],[10,3],[17,4],[25,8],[9,10],[16,9],[26,16],[4,19],[12,17],[20,17],[13,27],[25,27]])food.add(k(x,y));hud.textContent='Собери Monge: 0 / 12'}
build();
function roundRect(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function draw(t){g.clearRect(0,0,600,600);g.save();g.translate(300-cam.x,300-cam.y);
const minx=Math.max(0,Math.floor((cam.x-350)/S)),maxx=Math.min(N-1,Math.ceil((cam.x+350)/S)),miny=Math.max(0,Math.floor((cam.y-350)/S)),maxy=Math.min(N-1,Math.ceil((cam.y+350)/S));
g.fillStyle='#79ba6a';g.fillRect(0,0,W,W);
for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){let X=x*S,Y=y*S;if(!blocked(x,y)){roundRect(X-2,Y-2,S+4,S+4,14,(x*13+y*7)%3===0?'#e9c988':'#f3dca6');g.fillStyle='#fff2c655';g.beginPath();g.ellipse(X+18,Y+16,19,7,-.4,0,7);g.fill()}else{roundRect(X+3,Y+3,S-6,S-6,19,'#326b3d');roundRect(X+5,Y+1,S-10,S-10,22,'#4b9850');for(let j=0;j<4;j++){g.fillStyle=j%2?'#76c56d':'#91d879';g.beginPath();g.arc(X+13+(j%2)*25,Y+15+Math.floor(j/2)*26,13,0,7);g.fill()}}}
for(const f of flowers){if(Math.abs(f.x-cam.x)>390||Math.abs(f.y-cam.y)>390)continue;g.fillStyle='#4e9446';g.fillRect(f.x-1,f.y,2,12);for(let j=0;j<5;j++){let a=j*Math.PI*2/5;g.fillStyle=f.color;g.beginPath();g.arc(f.x+Math.cos(a)*6,f.y+Math.sin(a)*6+Math.sin(t/850+f.x)*1.2,4.5,0,7);g.fill()}g.fillStyle='#ffcd42';g.beginPath();g.arc(f.x,f.y,4,0,7);g.fill()}
for(const tr of trees){if(Math.abs(tr.x-cam.x)>390||Math.abs(tr.y-cam.y)>390)continue;g.fillStyle='#744e2d';g.fillRect(tr.x-6,tr.y-5,12,34);for(let j=0;j<3;j++){g.fillStyle=['#307c44','#409b4c','#61b65b'][j];g.beginPath();g.arc(tr.x+(j-1)*15,tr.y-17-(j%2)*10,22,0,7);g.fill()}}
 // Landmark pond, gazebo and bridge.
g.fillStyle='#4c9ac4';g.beginPath();g.ellipse(24*S,10*S,100,70,-.2,0,7);g.fill();g.strokeStyle='#b8e8ef';g.lineWidth=6;g.stroke();
for(let i=-2;i<=2;i++)roundRect(24*S-54+i*22,10*S-16,18,32,3,'#c58d55');
roundRect(3*S,24*S,120,80,18,'#a66e43');roundRect(3*S+12,24*S+12,96,56,12,'#f2d9a2');g.fillStyle='#b44f48';g.beginPath();g.moveTo(3*S-15,24*S+12);g.lineTo(3*S+60,24*S-42);g.lineTo(3*S+135,24*S+12);g.fill();
for(const v of food){let [x,y]=v.split(',').map(Number),X=(x+.5)*S,Y=(y+.5)*S;roundRect(X-17,Y-17,34,34,7,'#c5c8cb');roundRect(X-14,Y-14,28,28,5,'#fff');g.textAlign='center';g.fillStyle='#14183d';g.font='bold 11px Arial';g.fillText('monge',X,Y-3);roundRect(X-12,Y+1,24,8,1,'#4a0a26');g.fillStyle='#fff';g.font='bold 6px Arial';g.fillText('GASTRO',X,Y+7);roundRect(X,Y+10,12,5,1,'#ffa400')}
 // Upright placeholder character; proper sprite animation will be the next phase.
const bob=Math.sin(t/100)*2,px=p.x,py=p.y;g.fillStyle='#28492366';g.beginPath();g.ellipse(px,py+23,19,6,0,0,7);g.fill();
g.fillStyle='#d7b28c';for(let side of [-1,1])roundRect(px+side*9-5,py+11+bob+side*Math.sin(t/100)*3,10,15,4,'#b88153');
roundRect(px-15,py-4+bob,30,28,12,'#e2c59d');g.fillStyle='#c68950';g.beginPath();g.ellipse(px,py-18+bob,19,18,0,0,7);g.fill();for(let side of [-1,1]){g.fillStyle='#9e6138';g.beginPath();g.ellipse(px+side*15,py-28+bob,7,12,side*.25,0,7);g.fill();g.fillStyle='#241a18';g.beginPath();g.arc(px+side*7,py-19+bob,2.7,0,7);g.fill()}g.fillStyle='#33221b';g.beginPath();g.arc(px,py-12+bob,4,0,7);g.fill();g.restore()}
function canMove(x,y){const r=16;for(let dx of [-r,r])for(let dy of [-r,r])if(blocked(Math.floor((x+dx)/S),Math.floor((y+dy)/S)))return false;return true}
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;let dx=axis.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=axis.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(dx,dy)||1;dx=dx/l*210*dt;dy=dy/l*210*dt;if(canMove(p.x+dx,p.y))p.x+=dx;if(canMove(p.x,p.y+dy))p.y+=dy;let tile=k(Math.floor(p.x/S),Math.floor(p.y/S));if(food.delete(tile)){collected++;hud.textContent='Собери Monge: '+collected+' / 12'+(collected===12?' 🏆 ПОБЕДА!':'')}cam.x+=(Math.max(300,Math.min(W-300,p.x))-cam.x)*.1;cam.y+=(Math.max(300,Math.min(W-300,p.y))-cam.y)*.1;draw(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);
let active=null;function touch(e){const b=joy.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),d=Math.hypot(x,y),m=Math.min(43,d);axis={x:d?x/d:0,y:d?y/d:0};knob.style.transform='translate(calc(-50% + '+axis.x*m+'px),calc(-50% + '+axis.y*m+'px))'}
joy.addEventListener('pointerdown',e=>{active=e.pointerId;joy.setPointerCapture(active);touch(e)});joy.addEventListener('pointermove',e=>{if(active===e.pointerId)touch(e)});for(let ev of ['pointerup','pointercancel'])joy.addEventListener(ev,()=>{active=null;axis={x:0,y:0};knob.style.transform='translate(-50%,-50%)'});document.getElementById('restart').onclick=build;
</script></html>
