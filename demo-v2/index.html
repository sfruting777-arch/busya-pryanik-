var enemyLast=0;
function frame(t){
 if(document.getElementById('game').style.display==='none')return;
 if(!previousFrame){previousFrame=t;enemyLast=t}
 const dt=Math.min((t-previousFrame)/1000,0.05);
 previousFrame=t;
 if(!paused&&!over){
   update(dt);
   if(!over&&t-enemyLast>=ENEMY_STEP_MS){enemyUpdate();enemyLast=t}
 }else enemyLast=t;
 draw(1);
 requestAnimationFrame(frame);
}

const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyPointer=null,joyOrigin=null;

 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-(joyOrigin?.x??cx),dy=e.clientY-(joyOrigin?.y??cy),dist=Math.hypot(dx,dy),max=33,scale=dist>max?max/dist:1;

}
joy.addEventListener('pointerdown',e=>{e.preventDefault();if(joyPointer!==null)return;joyPointer=e.pointerId;joyOrigin={x:e.clientX,y:e.clientY};joy.classList.add('joy-active');joy.setPointerCapture(e.pointerId);joyMove(e)});
