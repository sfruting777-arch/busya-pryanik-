<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Пряник — сравнение походки</title><style>body{margin:0;background:#172a25;color:#fff;font:16px system-ui}canvas{display:block;width:100%;height:100%}header{position:fixed;top:15px;left:12px;right:12px;text-align:center;pointer-events:none}h1{font-size:23px;color:#ffe0a3;margin:5px}footer{position:fixed;bottom:25px;left:10px;right:10px;text-align:center}button{background:#ffda84;border:0;padding:12px;margin:4px;border-radius:14px;font-weight:bold;font-size:15px}button[aria-pressed=true]{background:#b6e297}p{font-size:13px;text-shadow:0 2px 3px #000}#error{color:#ffc9b8}</style><header><h1>🐾 Пряник: проверка походки</h1><p id="status">Загружаю модель…</p><p>Веди пальцем, чтобы повернуть • щипок — приблизить</p></header><footer><button id="original">Meshy</button><button id="fixed">Исправленный V5</button><button id="pause">Пауза</button><p>PRYANIK на обоих боках • правка свитера • ходьба V5</p><p id="error"></p></footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
try{const scene=new THREE.Scene();scene.background=new THREE.Color('#263b35');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(3,1.6,3);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xfff3df,0x647e78,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,6,4);scene.add(sun);const grid=new THREE.GridHelper(10,20,0x719989,0x405e50);scene.add(grid);let model,mixer,clips,paused=false;const clock=new THREE.Clock();
function select(i){if(!model)return;mixer.stopAllAction();model.scale.setScalar(1);model.position.set(0,0,0);mixer.clipAction(clips[i]).reset().play();mixer.update(0);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3());model.scale.setScalar(1.8/Math.max(size.x,size.y,size.z));model.updateMatrixWorld(true);const fitted=new THREE.Box3().setFromObject(model),center=fitted.getCenter(new THREE.Vector3());model.position.set(-center.x,-fitted.min.y,-center.z);document.querySelector('#status').textContent=i?'Исправленный V5 — спокойный шаг':'Исходная анимация Meshy';document.querySelector('#original').setAttribute('aria-pressed',String(i===0));document.querySelector('#fixed').setAttribute('aria-pressed',String(i===1))}
new GLTFLoader().load('./Pryanik_walk_compare.glb?v=lettered-v2',g=>{model=g.scene;
// Cover only the defective sweater faces with clean knit UVs.
// Separate faces avoid stretching UVs across the patch boundary.
const repairs=[];
model.traverse(o=>{
 if(!o.isSkinnedMesh||o.name!=='char1')return;
 const src=o.geometry,uv=src.attributes.uv,p=src.attributes.position,idx=src.index;
 const faces=[];
 const inside=k=>p.getX(k)<-.0015&&Math.pow((uv.getX(k)-.6145)/.017,2)+Math.pow((uv.getY(k)-.5895)/.015,2)<1;
 for(let k=0;k<idx.count;k+=3){const a=idx.getX(k),b=idx.getX(k+1),c=idx.getX(k+2);if(inside(a)||inside(b)||inside(c))faces.push(a,b,c);}
 const geo=src.clone();geo.setIndex(faces);
 const clean=geo.attributes.uv;
 for(let k=0;k<clean.count;k++)clean.setXY(k,clean.getX(k)+.020,clean.getY(k)+.018);
 clean.needsUpdate=true;
 const mat=o.material.clone();mat.polygonOffset=true;mat.polygonOffsetFactor=-2;mat.polygonOffsetUnits=-2;mat.depthWrite=false;
 const cover=new THREE.SkinnedMesh(geo,mat);cover.name='Sweater_clean_knit_patch';cover.renderOrder=1;
 cover.position.copy(o.position);cover.quaternion.copy(o.quaternion);cover.scale.copy(o.scale);
 cover.bindMode=o.bindMode;cover.bind(o.skeleton,o.bindMatrix);cover.frustumCulled=false;
 repairs.push([o.parent,cover]);
});
repairs.forEach(([parent,cover])=>parent.add(cover));
// Render lettering after the knit repair while retaining body occlusion.
model.traverse(o=>{
 if(!o.isMesh||!o.name.startsWith('PRYANIK_logo_'))return;
 o.renderOrder=2;
 o.material=o.material.clone();
 o.material.polygonOffset=true;
 o.material.polygonOffsetFactor=-4;
 o.material.polygonOffsetUnits=-4;
});
scene.add(model);clips=g.animations;mixer=new THREE.AnimationMixer(model);select(1)},undefined,e=>document.querySelector('#error').textContent='Не удалось загрузить GLB: '+e.message);document.querySelector('#original').onclick=()=>select(0);document.querySelector('#fixed').onclick=()=>select(1);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза'};function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer&&!paused)mixer.update(dt);controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){document.querySelector('#error').textContent=e.message}
</script></html>
