<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ОПЕРАЦИОННАЯ 3 · только загрузка GLB</title><style>*{box-sizing:border-box}body{margin:0;background:#243938;color:#fff;font-family:system-ui}canvas{display:block;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;text-shadow:0 2px 6px #000}h1{font-size:19px;margin:0 0 4px;color:#ffe3ac}#status{font-size:12px}#version{font-size:13px;font-weight:800;color:#ffd689;margin-top:6px}#progressBox{margin:10px auto 0;width:min(310px,85vw);display:none}#bar{height:13px;border-radius:20px;background:#40615a;overflow:hidden;border:1px solid #ffe3ac}#fill{height:100%;width:0%;background:#e3ba72;transition:width .12s}#progressText{font-size:13px;margin-top:5px;color:#ffe3ac}.buttons{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:6px}button{background:#375b4b;border:1px solid #ffe3ac;border-radius:11px;padding:12px 10px;color:#fff;font-weight:700}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>🐶 Пряник 2.0 — тест глаза v2</h1><div id="status">Пустая сцена · выбери GLB</div><div id="version">⚪ ПУСТО · ждём GLB</div><div id="progressBox"><div id="bar"><div id="fill"></div></div><div id="progressText">0%</div></div><label style="position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 80px);left:50%;transform:translateX(-50%);background:#d9af6a;color:#213c35;font-weight:700;border-radius:12px;padding:10px;font-size:14px">📂 Загрузить Пряника из «Файлов»<input id="local-glb" type="file" accept=".glb,model/gltf-binary" style="display:none"></label></header><div class="buttons"><button id="play">⏸ Пауза</button><button id="speed">🐾 ×1</button><button id="cam">↺ Камера</button></div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x243938);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x8a6851,2.1));const sun=new THREE.DirectionalLight(0xffe9cd,2.7);sun.position.set(-3,7,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x52745b}));floor.rotation.x=-Math.PI/2;scene.add(floor);const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.02,40);let yaw=.55,pitch=.2,r=2.6;function setCam(){cam.position.set(r*Math.sin(yaw)*Math.cos(pitch),.54+r*Math.sin(pitch),r*Math.cos(yaw)*Math.cos(pitch));cam.lookAt(0,.54,0)}setCam();let last=null;renderer.domElement.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!last)return;yaw-=(e.clientX-last[0])*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-last[1])*.006,-.2,1.2);last=[e.clientX,e.clientY];setCam()});renderer.domElement.addEventListener('pointerup',()=>last=null);let mixer,playing=true,speed=1,activeObject=null;
const status=document.getElementById('status'),version=document.getElementById('version'),progressBox=document.getElementById('progressBox'),fill=document.getElementById('fill'),progressText=document.getElementById('progressText');
let currentRequest=0;
function progress(p,label){progressBox.style.display='block';fill.style.width=p+'%';progressText.textContent=label;}
function showModel(g,fileName,request){if(request!==currentRequest)return;
 try{
  const o=g.scene;o.updateMatrixWorld(true);
  const b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());
  if(!Number.isFinite(sz.y)||sz.y<0.001)throw new Error('некорректная высота модели');
  o.scale.setScalar(1.04/sz.y);o.updateMatrixWorld(true);b.setFromObject(o);
  const center=b.getCenter(new THREE.Vector3());o.position.set(-center.x,-b.min.y+.015,-center.z);
  o.traverse(x=>{if(x.isSkinnedMesh)x.frustumCulled=false});
  if(activeObject)scene.remove(activeObject);activeObject=o;scene.add(o);
  mixer=new THREE.AnimationMixer(o);if(g.animations.length)mixer.clipAction(g.animations[0]).play();
  progress(100,'✅ 100% · модель готова');
  status.textContent='✅ Открыт только выбранный файл';
  version.textContent='Сейчас: '+fileName;
 }catch(e){status.textContent='❌ Ошибка отображения: '+e.message;progressText.textContent='Ошибка'}
}
document.getElementById('local-glb').addEventListener('change',e=>{
 const file=e.target.files?.[0];if(!file)return;
 const request=++currentRequest;
 status.textContent='Читаем файл из памяти iPhone';
 version.textContent='Выбран: '+file.name+' · '+(file.size/1048576).toFixed(1)+' МБ';
 progress(0,'Чтение файла: 0%');
 const reader=new FileReader();
 reader.onprogress=ev=>{if(request!==currentRequest)return;if(ev.lengthComputable){const percent=Math.round(100*ev.loaded/ev.total);progress(percent,'📂 Чтение файла: '+percent+'%')}else progress(0,'📂 Чтение файла…')};
 reader.onerror=()=>{if(request!==currentRequest)return;status.textContent='❌ Ошибка чтения файла';progressText.textContent='Проверь загрузку GLB в «Файлах»'};
 reader.onabort=()=>{if(request===currentRequest)status.textContent='Чтение отменено'};
 reader.onload=()=>{if(request!==currentRequest)return;progress(100,'✅ Чтение 100% · обрабатываем 3D…');status.textContent='⏳ Создаём модель, текстуры и скелет — это может занять время';
  let seconds=0;
  const ticker=setInterval(()=>{seconds++;if(request===currentRequest&&progressText.textContent.includes('обрабатываем'))progressText.textContent='⏳ Чтение 100% · обработка 3D: '+seconds+' с (процент недоступен)'},1000);
  try{new GLTFLoader().parse(reader.result,'',g=>{clearInterval(ticker);showModel(g,file.name,request)},err=>{clearInterval(ticker);if(request!==currentRequest)return;status.textContent='❌ Ошибка обработки GLB: '+(err?.message||String(err));progressText.textContent='Модель не открылась'})}
  catch(err){clearInterval(ticker);status.textContent='❌ '+err.message}
 };
 reader.readAsArrayBuffer(file);
 e.target.value='';
});
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'⏸ Пауза':'▶ Играть'};document.getElementById('speed').onclick=()=>{speed=speed===1?.5:speed===.5?1.5:1;document.getElementById('speed').textContent='🐾 ×'+speed};document.getElementById('cam').onclick=()=>{yaw=.55;pitch=.2;r=2.6;setCam()};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(mixer&&playing)mixer.update(dt*speed);renderer.render(scene,cam)}loop();window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
