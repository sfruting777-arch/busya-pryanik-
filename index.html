</style><section id="intro" aria-label="Вступительная заставка"><div id="introContent"><div class="introHeading"><div id="introTitle">🐾 Буся против Пряника</div><div id="introSubtitle">БИТВА ЗА MONGE</div></div><div class="introPortrait" aria-label="Семейная фотография с Бусей и Пряником"><img src="intro.jpg" alt="Жена держит Бусю и Пряника" draggable="false"><div class="pryanikBreath" aria-hidden="true"></div><div class="busyaWarmth" aria-hidden="true"></div></div><button id="introPlay" type="button" onclick="enterGame()">🐾 Играть</button></div></section><h1>🐾 Буся против Пряника</h1><p>БИТВА ЗА MONGE</p><section id="menu"><div class="choice-group"><p>Выбери героя:</p><div class="choice-buttons"><button class="hero-choice" onclick="start('pryanik')">🐶 Пряник</button><button class="hero-choice" onclick="start('busya')">🐕 Буся</button></div><img class="hero-showdown" src="hero_showdown.webp" alt="Пряник и Буся азартно смотрят друг на друга перед игрой" draggable="false" loading="eager"></div></section><section id="game"><div id="hud"></div><canvas id="field" width="600" height="600"></canvas><div id="status"></div><div id="controls"><div id="joystick" aria-label="Джойстик"><div id="stick"></div></div><button id="pauseButton" onclick="togglePause()">⏯ Пауза</button></div><div id="pad"><span class="empty"></span><button data-d="0,-1">▲</button><span class="empty"></span><button data-d="-1,0">◀</button><button onclick="togglePause()">⏯</button><button data-d="1,0">▶</button><span class="empty"></span><button data-d="0,1">▼</button><span class="empty"></span></div><button onclick="back()">Главное меню</button><p class="hint">Положи палец на джойстик и слегка веди в сторону. Разворачивайся мгновенно и заранее выбирай поворот — герой повернёт на ближайшем проходе. Можно использовать WASD. Звук включится после нажатия «Играть».</p></section><script>

// Responsive arcade movement: instant reversal, buffered turns and gentle junction snapping.

 if(over){hud.textContent=`${hero==='pryanik'?'🐶 Пряник':'🐕 Буся'} | Собрано: ${score} | Осталось: ${food.size} | ❤️ ${lives}`;return}
 const dist=Math.abs(player.x-enemy.x)+Math.abs(player.y-enemy.y);
 const newPhase=aiMode==='chase'?'danger':aiMode==='search'?'warning':'calm';
 if(newPhase!==phase){phase=newPhase;status.textContent=phase==='danger'?'⚠️ ОПАСНАЯ БЛИЗОСТЬ!':phase==='warning'?'Кто-то приближается…':'Собирай корм!'}
 if(++musicTick%(phase==='danger'?2:phase==='warning'?3:5)===0){let melody=phase==='danger'?[330,311,277,247]:phase==='warning'?[392,370,349,330]:[523,659,784,659];beep(melody[Math.floor(musicTick/(phase==='danger'?2:phase==='warning'?3:5))%4],phase==='danger'?.09:.13,phase==='danger'?'triangle':'sine',.014)}
 if(phase==='danger'&&Date.now()-lastLaugh>3200){laugh();lastLaugh=Date.now()}
 hud.textContent=`${hero==='pryanik'?'🐶 Пряник':'🐕 Буся'} | Собрано: ${score} | Осталось: ${food.size} | ❤️ ${lives}`;
}
function dog(x,y,isBusya){const px=x*40+20,py=y*40+20;ctx.save();ctx.translate(px,py);ctx.fillStyle=isBusya?'#e3a56a':'#bb6c32';ctx.beginPath();ctx.ellipse(0,2,15,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=isBusya?'#eab477':'#ce8749';if(isBusya){ctx.beginPath();ctx.moveTo(-12,-7);ctx.lineTo(-11,-24);ctx.lineTo(-1,-12);ctx.moveTo(12,-7);ctx.lineTo(11,-24);ctx.lineTo(1,-12);ctx.fill()}else{for(let a of [-12,12]){ctx.beginPath();ctx.arc(a,-8,9,0,7);ctx.fill()}}ctx.fillStyle='white';for(let a of [-6,6]){ctx.beginPath();ctx.arc(a,-2,3,0,7);ctx.fill()}ctx.fillStyle='#21151c';for(let a of [-6,6]){ctx.beginPath();ctx.arc(a,-2,1.7,0,7);ctx.fill()}ctx.beginPath();ctx.arc(0,6,3,0,7);ctx.fill();ctx.fillStyle=isBusya?'#e5453e':'#dfd1b3';ctx.fillRect(-10,12,20,5);ctx.restore()}
function draw(alpha=1){ctx.clearRect(0,0,600,600);for(let y=0;y<15;y++)for(let x=0;x<15;x++){ctx.fillStyle=map[y][x]==='#'?'#53617e':'#27344a';ctx.fillRect(x*40,y*40,40,40);if(map[y][x]==='#'){ctx.fillStyle='#677f8a';ctx.fillRect(x*40+2,y*40+2,36,7);ctx.fillStyle='#6d9962';ctx.fillRect(x*40+3,y*40+1,34,4)}}for(let key of food){let [x,y]=key.split(',').map(Number);ctx.font='24px system-ui';ctx.textAlign='center';if(hero==='pryanik'){ctx.fillText('🥫',x*40+20,y*40+29)}else{ctx.fillStyle='#a96b38';for(const [dx,dy,r] of [[-7,-4,5],[6,-6,5],[-1,7,6]]){ctx.beginPath();ctx.arc(x*40+20+dx,y*40+20+dy,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e4b078';ctx.lineWidth=1.2;ctx.stroke()}}}const blend=(from,to)=>from+(to-from)*alpha;
dog((prevEnemy?.x??enemy.x)+((enemy.x-(prevEnemy?.x??enemy.x))*Math.min(1,Math.max(0,(performance.now()-enemyLast)/ENEMY_STEP_MS))),(prevEnemy?.y??enemy.y)+((enemy.y-(prevEnemy?.y??enemy.y))*Math.min(1,Math.max(0,(performance.now()-enemyLast)/ENEMY_STEP_MS))),hero==='pryanik');
if(performance.now()<aiAlertUntil&&!over){ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText('❗',enemy.x*40+20,enemy.y*40-7)}
dog(px,py,hero==='busya');if(paused||over){ctx.fillStyle='#111b';ctx.fillRect(0,260,600,80);ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillText(over?(won?'🏆 ПОБЕДА!':'ИГРА ОКОНЧЕНА'): 'ПАУЗА',300,308)}}
var enemyLast=0;
function frame(t){
 if(document.getElementById('game').style.display==='none')return;
 if(!previousFrame){previousFrame=t;enemyLast=t}
 const dt=Math.min((t-previousFrame)/1000,0.05);
 previousFrame=t;
 if(!paused&&!over){
   update(dt);
   if(!over&&t-enemyLast>=ENEMY_STEP_MS){enemyUpdate();enemyLast=t}
 }else enemyLast=t;
 draw(1);
 requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){queuedDir=[...d];dir=[...d];e.preventDefault()}});document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=d});b.addEventListener('pointerup',()=>{dir=[0,0]});b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('pointercancel',()=>{dir=[0,0]})});
const ENEMY_STEP_MS=240;
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyPointer=null,joyOrigin=null;
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-(joyOrigin?.x??cx),dy=e.clientY-(joyOrigin?.y??cy),dist=Math.hypot(dx,dy),max=30,scale=dist>max?max/dist:1;
 stick.style.transform=`translate(calc(-50% + ${dx*scale}px),calc(-50% + ${dy*scale}px))`;
 if(dist<3){return} // Tiny accidental thumb movement must not erase a buffered turn.
 const next=Math.abs(dx)>=Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
 queuedDir=[...next];
 dir=[...next];
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();if(joyPointer!==null)return;joyPointer=e.pointerId;joyOrigin={x:e.clientX,y:e.clientY};joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();joyMove(e)}});
function joyEnd(e){if(e.pointerId!==joyPointer)return;joyPointer=null;joyOrigin=null;dir=[0,0];queuedDir=[0,0];stick.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);joy.addEventListener('lostpointercapture',joyEnd);joy.addEventListener('contextmenu',e=>e.preventDefault());
