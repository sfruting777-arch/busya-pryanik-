<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Буся — 3D походка v1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e6de;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#25221b}canvas{display:block;touch-action:none}#ui{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;background:#fffffff2;padding:13px;border-radius:17px;box-shadow:0 3px 15px #0002}h3{margin:0 0 6px;font-size:17px}p{font-size:12px;margin:5px 0;color:#5d5b55}#controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}button,.upload{border:none;padding:10px 12px;background:#dcd5c7;color:#29251c;font-size:14px;font-weight:600;border-radius:11px}.upload{display:inline-block;background:#a87b40;color:white}button.active{background:#a87b40;color:white}input[type=range]{width:105px}input[type=file]{display:none}#status{font-size:12px;color:#665e53}#error{color:#a22;font-size:12px}</style></head><body>
<div id="ui"><h3>🐶 Буся — проверка 3D-походки</h3><div id="status">Подготовка просмотрщика…</div><div id="controls"><button id="walk" class="active">Ходьба</button><button id="idle">Стоит</button><button id="pause">Пауза</button><span style="font-size:12px">Скорость</span><input id="speed" type="range" min=".25" max="2" value="1" step=".05"><label class="upload" for="file">Выбрать GLB</label><input id="file" type="file" accept=".glb,model/gltf-binary"></div><p>Крути модель пальцем, двумя пальцами приближай. Если модель не загружается автоматически, выбери «Busya_walk_idle_test_v1.glb» в «Файлах» iPhone.</p><div id="error"></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s),status=$('#status'),err=$('#error');const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e6de);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xa49a88,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-2,5,5);scene.add(sun);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=.3;orbit.maxDistance=10;let dog,mixer,actions=[],active=0,paused=false;const clock=new THREE.Clock(),loader=new GLTFLoader();
function show(g){if(dog){scene.remove(dog);mixer?.stopAllAction()}dog=g.scene;scene.add(dog);dog.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(dog),center=b.getCenter(new THREE.Vector3()),size=b.getSize(new THREE.Vector3());orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size.x*.75,size.y*.45,Math.max(size.x,size.y,size.z)*1.9));camera.lookAt(center);orbit.update();mixer=new THREE.AnimationMixer(dog);actions=g.animations.map(a=>mixer.clipAction(a));if(actions[0])actions[0].play();active=0;status.textContent='Модель загружена • анимаций: '+g.animations.length;err.textContent=g.animations.length?'':'В этом GLB нет готовой анимации. Нужен файл Busya_walk_idle_test_v1.glb.';$('#walk').classList.add('active');$('#idle').classList.remove('active')}
async function loadUrl(){try{let response=await fetch('./busya.glb');if(!response.ok)throw Error('Файл ещё не размещён в GitHub');const a=await response.arrayBuffer();loader.parse(a,'',show,e=>{err.textContent=String(e);status.textContent='Ошибка чтения модели'})}catch(e){status.textContent='Просмотрщик готов — выбери GLB с iPhone';err.textContent='Автоматическая загрузка пока недоступна: '+e.message}}
$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;status.textContent='Открываю '+file.name;err.textContent='';try{loader.parse(await file.arrayBuffer(),'',show,e=>{err.textContent=String(e)})}catch(ex){err.textContent=String(ex)}};
function pick(n){if(!actions.length)return;actions.forEach((a,i)=>{if(i===n)a.reset().fadeIn(.2).play();else a.fadeOut(.2)});active=n;$('#walk').classList.toggle('active',n===0);$('#idle').classList.toggle('active',n===1)}
$('#walk').onclick=()=>pick(0);$('#idle').onclick=()=>pick(1);$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза'};$('#speed').oninput=e=>{if(mixer)mixer.timeScale=Number(e.target.value)};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function frame(){requestAnimationFrame(frame);if(mixer&&!paused)mixer.update(Math.min(clock.getDelta(),.05));else clock.getDelta();orbit.update();renderer.render(scene,camera)}frame();loadUrl();
</script></body></html>
