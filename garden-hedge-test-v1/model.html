<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Изгородь с лапками — образец 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#dce6d5;color:#243c2c;font-family:system-ui;overflow:hidden}canvas{display:block}header{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;text-align:center;pointer-events:none}h1{font-size:19px;margin:0 0 6px}p{font-size:12px;margin:5px}nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button,a{border:1px solid #77936d;background:#fffffff2;border-radius:12px;padding:12px 15px;color:#294932;font-size:13px;text-decoration:none;touch-action:manipulation}button[aria-pressed=true]{background:#345940;color:white}#status{font-size:12px}</style></head><body><header><h1>🌿 Изгородь с цветами-лапками</h1><p>Поворачивай пальцем · двумя пальцами меняй масштаб</p><p id="status">Загружаем образец…</p></header><nav><button id="angle" aria-pressed="true">Общий вид</button><button id="top" aria-pressed="false">Сверху</button><button id="side" aria-pressed="false">Сбоку</button><a href="./">В сад →</a></nav><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#dce6d5');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.5,0);controls.minDistance=1;controls.maxDistance=8;
scene.add(new THREE.HemisphereLight(0xffffff,0x71904d,2.15));const sun=new THREE.DirectionalLight(0xffe5b9,1.75);sun.position.set(-7,12,6);scene.add(sun);
const plane=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0xc3cbb8}));plane.rotation.x=-Math.PI/2;plane.position.y=-.015;scene.add(plane);
function view(id){const d=innerHeight>innerWidth?1.3:1;const v={angle:[2.5*d,2.5*d,3*d],top:[0,4.3*d,.001],side:[0,.65,4.4*d]}[id];camera.position.set(...v);controls.target.set(0,.5,0);controls.update();for(const n of ['angle','top','side'])document.getElementById(n).setAttribute('aria-pressed',String(n===id));}
for(const id of ['angle','top','side'])document.getElementById(id).onclick=()=>view(id);view('angle');
new GLTFLoader().load('../garden-assets/pawprint-hedge-fixed-v1.glb',g=>{const root=g.scene;root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),mid=box.getCenter(new THREE.Vector3());root.position.set(-mid.x,-box.min.y,-mid.z);const holder=new THREE.Group();holder.add(root);holder.scale.set(1.71/size.x,1.08/size.y,1.71/size.z);root.traverse(o=>{if(o.isMesh){o.material.color.multiply(new THREE.Color(.85,.95,.85));if(o.material.map)o.material.map.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy())}});scene.add(holder);document.getElementById('status').textContent='Исправленный тестовый образец · 1';document.body.dataset.hedgeReady='true'},undefined,e=>{document.getElementById('status').textContent='Не удалось загрузить образец';console.error(e)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
