<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Пряник 2.0 — тест глаза v2</title><style>*{box-sizing:border-box}body{margin:0;background:#243938;color:#fff;font-family:system-ui}canvas{display:block;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;text-shadow:0 2px 6px #000}h1{font-size:19px;margin:0 0 4px;color:#ffe3ac}#status{font-size:12px}#version{font-size:13px;font-weight:800;color:#ffd689;margin-top:6px}.buttons{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:6px}button{background:#375b4b;border:1px solid #ffe3ac;border-radius:11px;padding:12px 10px;color:#fff;font-weight:700}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>🐶 Пряник 2.0 — тест глаза v2</h1><div id="status">Загружаем пациента…</div><div id="version">Сейчас: загрузка оригинала</div><label style="position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 80px);left:50%;transform:translateX(-50%);background:#d9af6a;color:#213c35;font-weight:700;border-radius:12px;padding:10px;font-size:14px">📂 Выбрать GLB из «Файлов»<input id="local-glb" type="file" accept=".glb,model/gltf-binary" style="display:none"></label></header><div class="buttons"><button id="play">⏸ Пауза</button><button id="speed">🐾 ×1</button><button id="cam">↺ Камера</button></div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x243938);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x8a6851,2.1));const sun=new THREE.DirectionalLight(0xffe9cd,2.7);sun.position.set(-3,7,5);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x52745b}));floor.rotation.x=-Math.PI/2;scene.add(floor);const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.02,40);let yaw=.55,pitch=.2,r=2.6;function setCam(){cam.position.set(r*Math.sin(yaw)*Math.cos(pitch),.54+r*Math.sin(pitch),r*Math.cos(yaw)*Math.cos(pitch));cam.lookAt(0,.54,0)}setCam();let last=null;renderer.domElement.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!last)return;yaw-=(e.clientX-last[0])*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-last[1])*.006,-.2,1.2);last=[e.clientX,e.clientY];setCam()});renderer.domElement.addEventListener('pointerup',()=>last=null);let mixer,playing=true,speed=1,activeObject=null;const status=document.getElementById('status');let currentRequest=0;function loadGLB(url,label){const request=++currentRequest;new GLTFLoader().load(url,g=>{if(request!==currentRequest)return;{try{const o=g.scene;o.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3());o.scale.setScalar(1.04/sz.y);o.updateMatrixWorld(true);b.setFromObject(o);const center=b.getCenter(new THREE.Vector3());o.position.set(-center.x,-b.min.y+.015,-center.z);o.traverse(x=>{if(x.isSkinnedMesh)x.frustumCulled=false});if(activeObject)scene.remove(activeObject);activeObject=o;scene.add(o);mixer=new THREE.AnimationMixer(o);if(g.animations.length)mixer.clipAction(g.animations[0]).play();status.textContent='✅ Файл загружен · поворачивай пальцем';document.getElementById('version').textContent='Сейчас: '+label;}catch(e){status.textContent='Ошибка скелета: '+e.message}},p=>{if(p.total)status.textContent='Загрузка модели: '+Math.round(p.loaded/p.total*100)+'%'},e=>status.textContent='Ошибка GLB: '+(e?.message||'ошибка загрузки'))}loadGLB('https://raw.githubusercontent.com/sfruting777-arch/busya-pryanik-/main/Pryanik_2_rig_walk_UPLOAD.glb','ОРИГИНАЛ (до исправления)');document.getElementById('local-glb').addEventListener('change',e=>{const file=e.target.files?.[0];if(file){status.textContent='Открываю '+file.name;const url=URL.createObjectURL(file);loadGLB(url,'ВЫБРАННЫЙ ФАЙЛ — '+file.name)}});document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'⏸ Пауза':'▶ Играть'};document.getElementById('speed').onclick=()=>{speed=speed===1?.5:speed===.5?1.5:1;document.getElementById('speed').textContent='🐾 ×'+speed};document.getElementById('cam').onclick=()=>{yaw=.55;pitch=.2;r=2.6;setCam()};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(mixer&&playing)mixer.update(dt*speed);renderer.render(scene,cam)}loop();window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
