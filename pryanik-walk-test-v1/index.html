import * as THREE from 'three';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
try{const scene=new THREE.Scene();scene.background=new THREE.Color('#263b35');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(3,1.6,3);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,0);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xfff3df,0x647e78,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,6,4);scene.add(sun);const grid=new THREE.GridHelper(10,20,0x719989,0x405e50);scene.add(grid);let model,mixer,clips,paused=false;const clock=new THREE.Clock();

new GLTFLoader().load('./Pryanik_walk_compare.glb?v=lettered-v2',g=>{model=g.scene;

model.traverse(o=>{if(!o.isMesh||o.name!=='char1')return;const uv=o.geometry.attributes.uv,p=o.geometry.attributes.position;if(!uv||!p)return;for(let i=0;i<uv.count;i++){const u=uv.getX(i),v=uv.getY(i);if(p.getX(i)<-.0015&&u>.595&&u<.636&&v>.574&&v<.610)uv.setY(i,v+.035)}uv.needsUpdate=true;});
scene.add(model);clips=g.animations;mixer=new THREE.AnimationMixer(model);select(1)},undefined,e=>document.querySelector('#error').textContent='Не удалось загрузить GLB: '+e.message);document.querySelector('#original').onclick=()=>select(0);document.querySelector('#fixed').onclick=()=>select(1);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза'};function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(mixer&&!paused)mixer.update(dt);controls.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){document.querySelector('#error').textContent=e.message}
