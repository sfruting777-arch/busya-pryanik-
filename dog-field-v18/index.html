function restoreMongeSilver(model){

  if(!node.isMesh)return;
  const originals=Array.isArray(node.material)?node.material:[node.material];
  const restored=originals.map(original=>{
   if(!original || !original.isMeshStandardMaterial)return original;
   const silver=original.clone();
   // Meshy metallic=1 needs an environment map, which this mobile scene lacks.
   silver.metalness=.08;
   silver.roughness=.55;
   silver.metalnessMap=null;
   silver.roughnessMap=null;
   // Textured normal map contains the false colored spots and baked wrinkles.
   silver.normalMap=null;
   silver.bumpMap=null;
   silver.onBeforeCompile=shader=>{
    shader.vertexShader='varying vec3 vMongeLocalNormal;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace(
      '#include <beginnormal_vertex>',
      '#include <beginnormal_vertex>\n vMongeLocalNormal = normalize(normal);'
    );
    shader.fragmentShader='varying vec3 vMongeLocalNormal;\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace(
      '#include <map_fragment>',
      '#include <map_fragment>\n float mongeSide = 1.0 - smoothstep(0.40, 0.84, abs(vMongeLocalNormal.z));\n diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.77,0.81,0.84), mongeSide);'
    );
   };
   silver.customProgramCacheKey=()=> 'monge-silver-side-v14';
   silver.needsUpdate=true;
   return silver;
  });
  node.material=Array.isArray(node.material)?restored:restored[0];
 });

 if(modified){
   const pitchAxis=new THREE.Vector3(0,1,0);
   const pitchQ=new THREE.Quaternion();
   for(const track of modified.tracks){
     const normalized=track.name.replace(/[^a-z0-9]/gi,'_').replace(/_+/g,'_');
     const part=normalized.match(/0_(Right|Left)_Limb_([012])(?:_|$)/i);
     if(!part||!track.name.endsWith('.quaternion'))continue;

 // Preserve the front stride and unchanged rear legs. Suppress shoulder flare only.
 let shouldersAdjusted=0;
 if(modified){
  for(const track of modified.tracks){
   const name=track.name.replace(/[^a-z0-9]/gi,'_').replace(/_+/g,'_');
   if(!/0_(Right|Left)_Limb_0(?:_|$)/i.test(name)||!track.name.endsWith('.quaternion'))continue;

 const walkClip=clips.find(c=>c.name==='Pryanik_gentle_walk_v1')||clips.find(c=>/walk/i.test(c.name))||clips[1];
 if(!walkClip)throw Error('Не найдена анимация Пряника');
 dog.walk=mixer.clipAction(walkClip);dog.walk.play();mixer.update(0);
 model.updateMatrixWorld(true);bounds.setFromObject(model);const mid=bounds.getCenter(new THREE.Vector3());
 model.position.set(-mid.x,-bounds.min.y+.018,-mid.z);dog.holder.add(model);dog.holder.rotation.y=Math.PI;dog.loaded=true;
}
let failures=[];
function refreshStatus(){
 const count=Number(busya.loaded)+Number(pryanik.loaded);
 el('status').textContent=count===2?'Оба героя на поле · переключай управление':count===0?'Загружаем двух артистов…':count===1?'Один герой готов · загружаем второго…':'';
 if(failures.length)el('message').textContent=failures.join(' · ');
}
function loadDog(url,fn,name){loader.load(url,g=>{try{fn(g)}catch(e){failures.push(name+': '+e.message)}refreshStatus()},undefined,e=>{failures.push(name+': не загрузился GLB');refreshStatus()})}
loadDog('../busya-world-v1/Busya_walk_idle_test_v1.glb?v=3',prepareBusya,'Буся');
loadDog('../pryanik-walk-test-v1/Pryanik_walk_compare.glb?v=lettered-v2',preparePryanik,'Пряник');
// v18 temporary comparison, never overwrite the approved Pryanik v1 GLB.
let newPryanikModel=null,usingNewPryanik=false;
const newPryanikURL='https://raw.githubusercontent.com/sfruting777-arch/busya-pryanik-/main/Pryanik_2_game_balanced.glb';
el('model-switch').textContent='⏳ Пряник 2.0 загружается…';
loader.load(newPryanikURL,g=>{
 try{
  const model=g.scene;
  model.updateMatrixWorld(true);
  let bbox=new THREE.Box3().setFromObject(model);
  const dim=bbox.getSize(new THREE.Vector3());
  const maxDim=Math.max(dim.x,dim.y,dim.z);
  if(!Number.isFinite(maxDim)||maxDim<.01)throw Error('Неверные размеры модели');
  model.scale.multiplyScalar(.9765/maxDim);
  model.updateMatrixWorld(true);
  bbox.setFromObject(model);
  const mid=bbox.getCenter(new THREE.Vector3());
  model.position.set(-mid.x,-bbox.min.y+.018,-mid.z);
  // The holder already rotates Pryanik by PI; do not rotate the new GLB a second time.
  model.rotation.y=0;
  // One additional static mesh within the same actor; no animation skin yet.
  model.visible=false;
  pryanik.holder.add(model);
  newPryanikModel=model;
  el('model-switch').textContent='🐶 Пряник 1.0 ↔ 2.0';
 }catch(e){el('message').textContent='Новый Пряник: '+e.message}
},xhr=>{if(xhr.total>0)el('model-switch').textContent='⏳ Пряник 2.0: '+Math.round(100*xhr.loaded/xhr.total)+'%';},e=>{el('model-switch').textContent='⚠️ Ошибка загрузки';el('message').textContent='Не удалось загрузить Пряника 2.0: '+(e?.message||'ошибка сети')});
el('model-switch').onclick=()=>{
 if(!newPryanikModel){
  el('message').textContent='Модель пока не готова. Дождись завершения загрузки или посмотри ошибку выше.';
  return;
 }
 usingNewPryanik=!usingNewPryanik;
 pryanik.holder.children.forEach(child=>{child.visible=child===newPryanikModel?usingNewPryanik:!usingNewPryanik});
 el('model-switch').textContent=usingNewPryanik?'✨ Пряник 2.0 (без анимации)':'🐶 Пряник 1.0 (анимация)';
 el('message').textContent=usingNewPryanik?'Пряник 2.0: пока скользит — скелет и ходьбу сделаем позже':'';
};

const joy=el('joy'),stick=el('stick');let jx=0,jy=0,activeTouch=null,pointerId=null;
function moveStick(x,y){const r=joy.getBoundingClientRect();let dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=Math.hypot(dx,dy),k=d>31?31/d:1;dx*=k;dy*=k;jx=dx/31;jy=dy/31;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
function stopStick(){activeTouch=null;pointerId=null;jx=jy=0;stick.style.transform='translate(0px,0px)'}
joy.addEventListener('touchstart',e=>{e.preventDefault();if(activeTouch!==null)return;const t=e.changedTouches[0];activeTouch=t.identifier;moveStick(t.clientX,t.clientY)},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===activeTouch)moveStick(t.clientX,t.clientY)},{passive:false});
joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===activeTouch)stopStick()},{passive:false});
joy.addEventListener('touchcancel',stopStick,{passive:false});
joy.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;pointerId=e.pointerId;joy.setPointerCapture(e.pointerId);moveStick(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===pointerId)moveStick(e.clientX,e.clientY)});
joy.addEventListener('pointerup',stopStick);joy.addEventListener('pointercancel',stopStick);
let paused=false,aiEnabled=true,view=0,controlled='busya';
const roaming={busya:{target:new THREE.Vector3(),stop:0,reactCooldown:0,reacting:0},pryanik:{target:new THREE.Vector3(),stop:0,reactCooldown:0,reacting:0}};
let encounterText='';
function randomDestination(id){
 const a=Math.random()*Math.PI*2,r=1+Math.random()*4.8;
 roaming[id].target.set(Math.cos(a)*r,0,Math.sin(a)*r);
}
randomDestination('busya');randomDestination('pryanik');
function controlledDog(){return dogs[controlled]}
function roamingDog(){return dogs[controlled==='busya'?'pryanik':'busya']}
function updateLabels(){
 const main=controlled==='busya'?'Бусей':'Пряником';
 const other=controlled==='busya'?'Пряник':'Буся';
 el('swap').textContent='🎮';el('swap').title='Управляю '+main+' — нажми, чтобы сменить';
 el('ai').textContent=aiEnabled?'🐾':'🛑';el('ai').title=other+': '+(aiEnabled?'гуляет':'стоит');
}
el('swap').onclick=()=>{
 controlled=controlled==='busya'?'pryanik':'busya';
 stopStick();
 randomDestination(roamingDog().id);
 roaming[roamingDog().id].stop=.6;
 roaming[roamingDog().id].reactCooldown=1.5;encounterText='';
 updateLabels();refreshFood();
};
el('view').onclick=()=>{view=(view+1)%3;el('view').textContent=['📷','👁️','↔️'][view];el('view').title=['Общий обзор','За героем','Вид спереди'][view]};
el('ai').onclick=()=>{aiEnabled=!aiEnabled;if(!aiEnabled){encounterText='';roaming[roamingDog().id].reacting=0}updateLabels()};
el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'▶':'⏸';el('pause').title=paused?'Продолжить':'Пауза'};
el('reset').onclick=()=>{
 busya.actor.position.set(-1.1,0,1.5);
 pryanik.actor.position.set(1.2,0,.9);
 busya.actor.rotation.y=0;pryanik.actor.rotation.y=0;
 stopStick();encounterText='';collected=0;el('score').textContent='🥫 Monge: 0';pickup.position.set(0,0,-1.9);refreshFood();for(const id of ['busya','pryanik']){roaming[id].stop=0;roaming[id].reacting=0;roaming[id].reactCooldown=1;randomDestination(id)}
};
updateLabels();refreshFood();
function walkDog(dog,isMoving,dt,speed){
 if(!dog.loaded)return;
 if(dog.id==='pryanik'&&usingNewPryanik)return;
 if(dog.id==='busya'){
  if(isMoving!==dog.moving){
   if(isMoving&&dog.walk){dog.walk.reset().fadeIn(.18).play();if(dog.idle)dog.idle.fadeOut(.18)}
   else if(dog.idle){dog.idle.reset().fadeIn(.18).play();if(dog.walk)dog.walk.fadeOut(.18)}
  }
  dog.mixer.timeScale=isMoving?2.8*Math.max(.35,speed/2.14245):1;dog.mixer.update(dt);
 }else{
  if(isMoving!==dog.moving){
   dog.walk.reset().play();dog.mixer.update(0);
  }
  if(isMoving){dog.mixer.timeScale=2.8;dog.mixer.update(dt)}
 }
 dog.moving=isMoving;
}
function moveActor(dog,dx,dz,step,dt){
 const a=dog.actor;const boundary=6.65;
 a.position.x=THREE.MathUtils.clamp(a.position.x+dx*step,-boundary,boundary);
 a.position.z=THREE.MathUtils.clamp(a.position.z+dz*step,-boundary,boundary);
 const heading=Math.atan2(-dx,-dz),delta=Math.atan2(Math.sin(heading-a.rotation.y),Math.cos(heading-a.rotation.y));
 a.rotation.y+=delta*(1-Math.exp(-dt*8));
}
const clock=new THREE.Clock(),desired=new THREE.Vector3(),target=new THREE.Vector3();
cam.position.set(0,6.8,11);cam.lookAt(0,.7,0);
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);
 const player=controlledDog(),npc=roamingDog();
 if(!paused){
   const mag=Math.min(1,Math.hypot(jx,jy)),moving=mag>.12;
   const playerSpeed=player.id==='busya'?2.14245:1.863;
   if(moving&&player.loaded){
     // Move relative to the camera's horizontal view direction:
     // up = away from the screen, right = screen right, even in front view.
     const forward=new THREE.Vector3();
     cam.getWorldDirection(forward);forward.y=0;forward.normalize();
     const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
     const dir=forward.multiplyScalar(-jy/mag).addScaledVector(right,jx/mag).normalize();
     moveActor(player,dir.x,dir.z,dt*playerSpeed*mag,dt);
   }
   walkDog(player,moving,dt,playerSpeed*mag);
   let npcMoving=false;
   if(aiEnabled&&npc.loaded&&player.loaded){
     const nav=roaming[npc.id];
     nav.reactCooldown=Math.max(0,nav.reactCooldown-dt);
     const separation=npc.actor.position.distanceTo(player.actor.position);
     // First real dog-to-dog interaction. A short look, then a distinct response.
     // Pryanik is timid and trots away; Busya is curious and approaches.
     if(separation<1.55&&nav.reactCooldown===0&&nav.reacting===0){
       nav.reacting=1;nav.stop=.6;nav.reactCooldown=4.5;
       encounterText=npc.id==='pryanik'?'🐶 Пряник заметил Бусю!':'🐻 Буся заметил Пряника!';
     }
     if(nav.reacting===1){
       // Face player while looking; only rotate root, never change skeleton.
       const toward=player.actor.position.clone().sub(npc.actor.position);
       const heading=Math.atan2(-toward.x,-toward.z),delta=Math.atan2(Math.sin(heading-npc.actor.rotation.y),Math.cos(heading-npc.actor.rotation.y));
       npc.actor.rotation.y+=delta*(1-Math.exp(-dt*7));
       nav.stop=Math.max(0,nav.stop-dt);
       if(nav.stop===0){nav.reacting=2;nav.stop=npc.id==='pryanik'?1.2:1.0}
     }else if(nav.reacting===2){
       nav.stop=Math.max(0,nav.stop-dt);
       const away=npc.actor.position.clone().sub(player.actor.position);away.y=0;
       let speed;
       if(npc.id==='pryanik'){
         speed=1.18;
         if(away.lengthSq()<.01)away.set(1,0,0);
         away.normalize();
       }else{
         speed=.85;
         if(separation<.9){nav.stop=0;away.set(0,0,0)}
         else away.normalize().negate();
       }
       if(away.lengthSq()>.01){moveActor(npc,away.x,away.z,dt*speed,dt);npcMoving=true}
       if(nav.stop===0){nav.reacting=0;randomDestination(npc.id);nav.stop=1.0;encounterText=''}
     }else{
       if(nav.stop>0)nav.stop=Math.max(0,nav.stop-dt);
       else{
         const diff=nav.target.clone().sub(npc.actor.position);diff.y=0;
         const distance=diff.length();
         if(distance<.28){nav.stop=.8+Math.random()*2.0;randomDestination(npc.id)}
         else{
           const speed=npc.id==='busya'?1.42:.85;
           const step=Math.min(distance,dt*speed);
           diff.normalize();moveActor(npc,diff.x,diff.z,step,dt);npcMoving=true;
         }
       }
     }
   }
   walkDog(npc,npcMoving,dt,npc.id==='busya'?1.42:.85);
   if(collectTimer>0)collectTimer=Math.max(0,collectTimer-dt);
   else checkPickup(player);
 }
 // Rotate the tray only; keep the pickup ring and glow stationary.
 mongeHolder.rotation.y+=dt*.8;
 pickup.position.y=.18+Math.sin(clock.elapsedTime*2.2)*.065;
 const now=clock.elapsedTime;
 glow.material.opacity=.39+.09*Math.sin(now*3.4);
 glow.scale.setScalar(1.10+.07*Math.sin(now*3.4));
 halo.rotation.z=now*.55;
 for(let i=0;i<sparks.length;i++){
   const a=now*.85+i*2*Math.PI/sparks.length,r=.38+.05*Math.sin(now*2+i);
   sparks[i].position.set(Math.cos(a)*r,.24+.15*Math.sin(now*2.4+i*1.7),Math.sin(a)*r);
 }
 if(flashTimer>0){
   flashTimer=Math.max(0,flashTimer-dt);
   flash.visible=true;flash.scale.setScalar(1+3*(.42-flashTimer));
   flash.material.opacity=flashTimer/.42*.36;
 }else flash.visible=false;
 for(const d of [busya,pryanik])d.shadow.position.set(d.actor.position.x,.033,d.actor.position.z);
 const centre=new THREE.Vector3().addVectors(busya.actor.position,pryanik.actor.position).multiplyScalar(.5);
 if(view===0){desired.set(centre.x,6.8,centre.z+11);target.set(centre.x,.65,centre.z)}
 else if(view===1){desired.copy(player.actor.position).add(new THREE.Vector3(0,3.7,6.1));target.copy(player.actor.position).add(new THREE.Vector3(0,.65,0))}
 else {desired.set(centre.x,3.3,centre.z-8);target.set(centre.x,.75,centre.z)}
 const factor=1-Math.exp(-dt*3.5);cam.position.lerp(desired,factor);cam.lookAt(target);
 el('position').textContent=(controlled==='busya'?'🎮 Буся':'🎮 Пряник')+' · '+(encounterText&&aiEnabled?encounterText:'второй '+(aiEnabled?'гуляет':'отдыхает'));
 renderer.render(scene,cam);
}
animate();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
